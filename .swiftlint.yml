included:
  - examples

# Keep the SwiftLint GitHub Actions workflow scoped to examples and this config.

excluded:
  - examples/**/.build
  - examples/**/.swiftpm

identifier_name:
  min_length:
    warning: 3
    error: 2
  excluded:
    - id
    - ip
    - op
    - tv
    - vc
    - vm
    - ws

nesting:
  type_level:
    warning: 3
    error: 4
  function_level:
    warning: 2
    error: 3
