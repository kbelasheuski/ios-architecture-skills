name: SwiftLint

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - ".swiftlint.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".swiftlint.yml"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint examples
        run: swiftlint --no-cache --config .swiftlint.yml
