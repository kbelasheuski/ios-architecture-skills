name: Examples

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "plugin/skills/ios-architect/assets/examples/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "plugin/skills/ios-architect/assets/examples/**"
      - ".github/workflows/examples.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: plugin/skills/ios-architect/assets/examples/mvc
            scheme: MVCExample
          - path: plugin/skills/ios-architect/assets/examples/mvp
            scheme: MVPExample
          - path: plugin/skills/ios-architect/assets/examples/mvvm-uikit
            scheme: MVVMUIKitExample
          - path: plugin/skills/ios-architect/assets/examples/mvvm-swiftui
            scheme: MVVMSwiftUIExample
          - path: plugin/skills/ios-architect/assets/examples/mvvm-swiftui-combine
            scheme: MVVMSwiftUICombineExample
          - path: plugin/skills/ios-architect/assets/examples/mvvm-c
            scheme: MVVMCExample
          - path: plugin/skills/ios-architect/assets/examples/mvi
            scheme: MVIExample
          - path: plugin/skills/ios-architect/assets/examples/coordinator
            scheme: CoordinatorExample
          - path: plugin/skills/ios-architect/assets/examples/viper
            scheme: VIPERExample
          - path: plugin/skills/ios-architect/assets/examples/clean-swift
            scheme: CleanSwiftExample
          - path: plugin/skills/ios-architect/assets/examples/clean-architecture
            scheme: CleanArchitectureExample
          - path: plugin/skills/ios-architect/assets/examples/modular-tma
            scheme: ModularTMAExample-Package
          - path: plugin/skills/ios-architect/assets/examples/modular-tma
            scheme: UsersApp
            action: build
            extra_args: -project Apps/ModularApps.xcodeproj
          - path: plugin/skills/ios-architect/assets/examples/modular-tma
            scheme: UserListDemo
            action: build
            extra_args: -project Apps/ModularApps.xcodeproj
          - path: plugin/skills/ios-architect/assets/examples/redux-reswift
            scheme: ReduxReSwiftExample
          - path: plugin/skills/ios-architect/assets/examples/ribs
            scheme: RIBsExample
          - path: plugin/skills/ios-architect/assets/examples/tca
            scheme: TCAExample
            extra_args: -skipMacroValidation

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Test
        working-directory: ${{ matrix.path }}
        run: |
          SIMULATOR_NAME="$(xcrun simctl list devices available | sed -n 's/.*\(iPhone [^(]*\) (.*/\1/p' | head -n 1)"
          if [ -z "$SIMULATOR_NAME" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          xcodebuild "${{ matrix.action || 'test' }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            ${{ matrix.extra_args }}
